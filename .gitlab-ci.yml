stages:
  - build
  - deploy

build:
  image: node:latest
  stage: build
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - cat $ENV_DEV >> ./.env
    - npm install --progress=false
    - npm ci
  only:
    - develop
  artifacts:
    expire_in: 1 week
    paths:
      - dist


deploy:
  image: node:latest
  stage: deploy
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - rsync -rav --delete dist/ gitlab-runner@194.67.91.197:/var/www/www-root/data/www/rmok.online
  only:
    - develop
  artifacts:
    paths:
      - dist

