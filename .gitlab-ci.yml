stages:
  - build-review
  - deploy-review
  - build-production
  - deploy-production

cache:
  policy: pull-push
  paths:
    - node_modules/


# Review
build_review:
  image: node:14.16.0-alpine3.12
  stage: build-review
  script:
    - cat $VUE_ENV_DEVELOPMENT >> ./.env
    - npm install --progress=false
    - npm run build
  only:
    - develop
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - review

# todo: Test stage

deploy_review:
  stage: deploy-review
  script:
    - rsync -rq --delete ./dist/* /var/www/www-root/data/www/rmok.online
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - review
  only:
    - develop






# Production
build_production:
  image: node:14.16.0-alpine3.12
  stage: build-production
  script:
    - cat $VUE_ENV_PRODUCTION > ./.env
    - npm install --progress=false
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  when: manual
  tags:
    - production
  only:
    - develop

# todo: Test stage

deploy_production:
  stage: deploy-production
  script:
    - rsync -rq --delete ./dist/* /var/www/ui.rmok
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  needs:
    - job: build_production
      artifacts: true
  tags:
    - production
  only:
    - develop

