stages:
  - merge-request
  - build-review
  - deploy-review
  - build-production
  - deploy-production


.only-default: &only-default
  only:
    - develop
    - merge_requests

cache:
  policy: pull-push
  paths:
    - node_modules/

# Запускается каждый раз, когда создают новый запрос на слияние.
# Здесь мы должны протестировать функционал, до того как запрос будет слит в общую ветку.
build_merge_requests:
  image: node:14.16.0-alpine3.12
  stage: merge-request
  before_script:
    - curl --location --request GET 'https://api.telegram.org/bot1771388084:AAHxswf1LQmqGIypwKsyfnR4SVZZYhExZ9g/sendMessage?chat_id=693950562&text=Pipeline%20merge%20request%20start'
  script:
    - npm install --progress=false
    - cat $VUE_ENV_DEVELOPMENT >> ./.env
    - npm run build
    - rsync -rq --delete ./dist/* /var/www/feature.rmok.online
    - curl --location --request GET 'https://api.telegram.org/bot1771388084:AAHxswf1LQmqGIypwKsyfnR4SVZZYhExZ9g/sendMessage?chat_id=693950562&text=Pipeline%20merge%20request%20success'
  artifacts:
    expire_in: 30 mins
    paths:
      - dist
  only:
    - merge_requests

# Review
build_review:
  image: node:14.16.0-alpine3.12
  stage: build-review
  <<: *only-default
  script:
    - cat $VUE_ENV_DEVELOPMENT >> ./.env
    - npm install --progress=false
    - npm run build
  only:
    - develop
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - vue
    - development

# todo: Test stage

deploy_review:
  stage: deploy-review
  <<: *only-default
  script:
    - rsync -rq --delete ./dist/* /var/www/rmok.online
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - vue
    - development
  only:
    - develop






# Production
build_production:
  image: node:14.16.0-alpine3.12
  stage: build-production
  script:
    - cat $VUE_ENV_PRODUCTION > ./.env
    - npm install --progress=false
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  when: manual
  tags:
    - production
  only:
    - develop

# todo: Test stage

deploy_production:
  stage: deploy-production
  script:
    - rsync -rq --delete ./dist/* /var/www/ui.rmok
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  needs:
    - job: build_production
      artifacts: true
  tags:
    - production
  only:
    - develop

