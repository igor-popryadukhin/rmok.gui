stages:
  - unit-test
  - build-review
  - build-production
  - deploy-production


#.only-default: &only-default
#  only:
#    - develop
#    - merge_requests

cache:
  policy: pull-push
  paths:
    - node_modules/

# Unit test
unit_test:
  image: v16.13.0
  stage: unit-test
  script:
    - npm install --progress=false
    - npm run test:unit
  only:
    - develop
  tags:
    - vue

# Review
build_review:
  image: v16.13.0
  stage: build-review
  script:
    - cat $VUE_ENV_REVIEW >> ./.env
    - npm install --progress=false
    - npm run build || exit_code=$?
    - if [ $exit_code -ne 0 ]; then echo "Сборка звершилась с ошибкой"; fi;
    - cd ./dist
    - rsync -rq --delete . ~/rmok.ui
  only:
    - develop
  artifacts:
    expire_in: 90 days
    paths:
      - dist
  tags:
    - vue


# Production
build_production:
  image: v16.13.0
  stage: build-production
  script:
    - cat $VUE_ENV_PRODUCTION > ./.env
    - npm install --progress=false
    - npm run build || exit_code=$?
    - if [ $exit_code -ne 0 ]; then echo "Сборка звершилась с ошибкой"; fi;
  artifacts:
    expire_in: 90 days
    paths:
      - dist
  when: manual
  tags:
    - production
  only:
    - develop

deploy_production:
  image: v16.13.0
  stage: deploy-production
  script:
    - ls -l
    - cd ./dist
    - rsync -rq --delete . /var/www/ui.rmok
  artifacts:
    expire_in: 90 days
    paths:
      - dist
  when: manual
  tags:
    - production
  only:
    - develop

