stages:
  - build-development
  - deploy-development
  - build-production
  - deploy-production

cache:
  policy: pull-push
  paths:
    - node_modules/


# Development
build_development:
  image: node:14.16.0-alpine3.12
  stage: build-development
  script:
    - cat $VUE_ENV_DEVELOPMENT >> ./.env
    - npm install --progress=false
    - npm run build
  only:
    - develop
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - development

deploy_development:
  stage: deploy-development
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_DEVELOPMENT" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo $SSH_OPEN_KEY_DEVELOPMENT > ~/.ssh/authorized_keys
  script:
    - rsync -rav --delete ./dist/* gitlab-runner@$HOST_DEVELOPMENT:/var/www/www-root/data/www/rmok.online
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  tags:
    - development
  only:
    - develop

# Production
build_production:
  image: node:14.16.0-alpine3.12
  stage: build-production
  script:
    - cat $VUE_ENV_PRODUCTION > ./.env
    - npm install --progress=false
    - npm run build
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  when: manual
  tags:
    - production
  only:
    - develop

deploy_production:
  stage: deploy-production
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_PRODUCTION" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo $SSH_OPEN_KEY_PRODUCTION > ~/.ssh/authorized_keys
  script:
    - rsync -rav --delete ./dist/* gitlab-runner@$HOST_PRODUCTION:/var/www/ui.rmok
  artifacts:
    expire_in: 30 days
    paths:
      - dist
  needs:
    - job: build_production
      artifacts: true
  tags:
    - production
  only:
    - develop

