stages:
  - build
  - deploy

build-dev:
  image: node:latest
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist # путь к артефакту должен быть /public для GitLab Pages
    expire_in: 1 days
  only:
    - develop

# Развёртываю production на тестовом сервере (production for test)
deploy-dev:
  stage: deploy
  script:
    - eval "$(ssh-agent)"
    - ssh-add <(echo "$RMOK_DEV_SSH_PRIVATE_KEY")
    - ssh -p22 user@84.201.160.194 "sudo rm -R /var/www/admin/data/www/rmok.online/*"
    - scp -P22 -r dist/* user@84.201.160.194:/var/www/admin/data/www/rmok.online
  only:
    - develop
