stages:
  - build
  - deploy

build-dev:
  image: node:latest
  stage: build
  script:
    - mkdir build
    - touch one
    - touch two
#    - npm ci
#    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 days
  only:
    - develop

# Развёртываю production на тестовом сервере (production for test)
deploy-dev:
  stage: deploy
  script:
    - eval "ssh-agent -s"
    - ssh-add <(echo "$RMOK_DEV_SSH_PRIVATE_KEY")
    - ssh -p22 user@84.201.160.194 "sudo rm -R /var/www/admin/data/www/rmok.online/*"
    - scp -P22 -r build/* user@84.201.160.194:/var/www/admin/data/www/rmok.online
  artifacts:
    paths:
      - build/
  only:
    - develop
