stages:
  - build
  - deploy

build-dev:
  image: node:latest
  stage: build
  script:
    - echo $RMOK_DEV_SSH_PRIVATE_KEY
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist # путь к артефакту должен быть /public для GitLab Pages
    expire_in: 1 days
  only:
    - develop

deploy-dev:
  stage: deploy
  script:
    - echo $RMOK_DEV_SSH_PRIVATE_KEY
  only:
    - develop
