stages:
  - build

# Build a project for production testing
build-dev:
  image: node:latest
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - cat $ENV_DEV >> ./.env
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 days
  only:
    - develop
