stages:
  - test
  - build
  - notify

# Build a project for production testing
build-dev:
  image: node:latest
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - cat $ENV_DEV >> ./.env
    - npm ci
    - npm run build
#  after_script:
    # Send report to email
#    - curl --ssl-reqd --url 'smtps://smtp.gmail.com:465'\
#    - --user '$EMAI_FROM:$EMAI_FROM_PASSWPRD'\
#    - --mail-from '$EMAI_FROM'\
#    - --mail-rcpt '$EMAI_TO' \
#    - --upload-file ./dist/report.html
  artifacts:
    paths:
      - dist/
    expire_in: 1 days
  only:
    - develop

send_email:
  stage: notify
  when: on_failure
  script: curl --ssl-reqd --url "smtps://smtp.gmail.com:465"
    -F from='Gitlab <$EMAI_FROM>'
    -F to=$EMAI_TO
    -F subject='#$GITLAB_USER_ID'
    -F text='Gitlab отчёт'
    -F attachment='./dist/report.html'


# Build a project for production
build-prod:
  image: node:latest
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - cat $ENV_PROD >> ./.env
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  only:
    - release
