pipelines:
  branches:
    release/*:
      # Build
      - step:
          name: "Build"
          image: node:16.13.0
          trigger: automatic
          caches:
            - pip
            - node
          runs-on:
            - self.hosted
            - dev
          artifacts:
            - dist/**
          script:
            - git pull
            - echo $REVIEW_VUE_ENV | base64 -di > ./.env
            - npm install --no-progress
            - npm run build

      # Deploy
      - step:
          name: "Deploy"
          trigger: automatic
          caches:
            - pip
          runs-on:
            - self.hosted
            - dev
          artifacts:
            - dist/**
          script:
            - pipe: atlassian/rsync-deploy:0.7.0
              variables:
                USER: $REVIEW_SSH_USER
                SERVER: $REVIEW_SSH_SERVER
                REMOTE_PATH: "~/www/rmok.gui"
                LOCAL_PATH: "./dist/"
                EXTRA_ARGS: "--delete"

      # Update production!!!
      - step:
          name: "Update production!!!"
          trigger: manual
          runs-on:
            - self.hosted
            - dev
          script:
            - apt-get update
            - apt-get install -y jq
            - export VUE_PROJECT_VERSION="$(date +'v%Y.%-m.%-d.')$BITBUCKET_BUILD_NUMBER"
            - tmp_package=$(mktemp) && jq --arg version "$VUE_PROJECT_VERSION" '.version = $version' package.json > "$tmp_package" && mv "$tmp_package" package.json
            - git commit -am "Release $VUE_PROJECT_VERSION"
            - git push

      # Create a tag
      - step:
          name: "Create a tag"
          trigger: automatic
          runs-on:
            - self.hosted
            - dev
          script:
            - apt-get update
            - apt-get install -y jq
            - git pull
            - version=$(jq -r '.version' package.json)
            - git tag -a $version -m "Release $version"
            - git push --tags


  tags:
    v*:
      # Build
      - step:
          name: "Build"
          image: node:16.13.0
          trigger: automatic
          caches:
            - pip
            - node
          runs-on:
            - self.hosted
            - dev
          artifacts:
            - dist/**
          script:
            - echo $PROD_VUE_ENV | base64 -di > ./.env
            - npm install --no-progress
            - npm run build

      # Deploy
      - step:
          name: "Deploy"
          trigger: automatic
          caches:
            - pip
          runs-on:
            - self.hosted
            - dev
          artifacts:
            - dist/**
          script:
            - pipe: atlassian/rsync-deploy:0.7.0
              variables:
                USER: $PROD_SSH_USER
                SERVER: $PROD_SSH_SERVER
                REMOTE_PATH: "~/www/rmok.gui"
                LOCAL_PATH: "./dist/"
                EXTRA_ARGS: "--delete"
