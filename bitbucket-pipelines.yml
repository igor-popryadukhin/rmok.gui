pipelines:
  default:
    - step:
        name: "Build for review"
        runs-on: self.hosted
        image: node:16.13.0
        artifacts:
          - dist
        script:
          - echo $VUE_ENV_REVIEW | base64 -di > ./.env
          - npm install
          - npm run build
          - pipe: atlassian/rsync-deploy:0.7.0
            variables:
              USER: $RSYNC_USER
              SERVER: $RSYNC_SERVER
              REMOTE_PATH: $RSYNC_REMOTE_PATH
              LOCAL_PATH: 'dist'

